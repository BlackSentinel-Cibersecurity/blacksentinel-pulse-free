<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B2C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EA580C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D2D2D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A1A;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Circle border -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#orangeGrad)" stroke-width="2" filter="url(#glow)"/>
  <!-- Shield shape -->
  <path d="M50 15 L75 30 L75 55 C75 70 62 82 50 88 C38 82 25 70 25 55 L25 30 Z" 
        fill="url(#darkGrad)" stroke="#3D3D3D" stroke-width="1"/>
  <!-- Right half orange overlay -->
  <clipPath id="rightHalf">
    <rect x="50" y="10" width="50" height="90"/>
  </clipPath>
  <path d="M50 15 L75 30 L75 55 C75 70 62 82 50 88 C50 88 50 15 50 15 Z" 
        fill="url(#orangeGrad)" clip-path="url(#rightHalf)" opacity="0.9"/>
  <!-- Center line -->
  <line x1="50" y1="15" x2="50" y2="88" stroke="#0A0A0A" stroke-width="2"/>
  <!-- Eye glow -->
  <ellipse cx="42" cy="42" rx="3" ry="2" fill="#FFFFFF" filter="url(#glow)"/>
  <ellipse cx="58" cy="42" rx="3" ry="2" fill="#FFFFFF" filter="url(#glow)"/>
</svg>
