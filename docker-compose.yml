services:
  postgres:
    image: postgres:16-alpine
    container_name: blacksentinel-db
    environment:
      POSTGRES_USER: blacksentinel
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bspulse2024}
      POSTGRES_DB: blacksentinel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blacksentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: blacksentinel-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: blacksentinel-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://blacksentinel:${DB_PASSWORD:-bspulse2024}@postgres:5432/blacksentinel
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-$(python3 -c "import secrets; print(secrets.token_hex(32))")}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:80}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: blacksentinel-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
