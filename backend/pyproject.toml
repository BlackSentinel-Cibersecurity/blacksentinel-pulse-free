[tool.poetry]
name = "blacksentinel-pulse"
version = "1.0.0"
description = "BlackSentinel Pulse - AI Autonomous Attack Surface Management Platform"
authors = ["BlackSentinel Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlalchemy = "^2.0.23"
alembic = "^1.13.0"
asyncpg = "^0.29.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
redis = {extras = ["hiredis"], version = "^5.0.0"}
neo4j = "^5.15.0"
celery = {extras = ["redis"], version = "^5.3.0"}
httpx = "^0.25.0"
aiohttp = "^3.9.0"
dnspython = "^2.4.0"
python-nmap = "^0.7.1"
shodan = "^1.30.0"
censys = "^2.2.0"
whois = "^0.9.0"
tldextract = "^5.0.0"
cryptography = "^41.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
websockets = "^12.0"
networkx = "^3.2.0"
scikit-learn = "^1.3.0"
numpy = "^1.26.0"
pandas = "^2.1.0"
prometheus-client = "^0.19.0"
structlog = "^23.2.0"
elastic-apm = "^6.22.0"
boto3 = "^1.33.0"
azure-identity = "^1.15.0"
azure-mgmt-resource = "^23.0.0"
google-cloud-resource-manager = "^1.10.0"
google-auth = "^2.25.0"
pyyaml = "^6.0.1"
toml = "^0.10.2"
python-dateutil = "^2.8.2"
orjson = "^3.9.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
mypy = "^1.7.0"
ruff = "^0.1.0"
black = "^23.11.0"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
